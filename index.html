<!-- Chat Flotante Premium -->
<style>
  /* Contenedor flotante */
  #chat-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    z-index: 1000;
  }

  /* Botón flotante */
  #chat-button {
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    cursor: pointer;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  #chat-button:hover {
    transform: scale(1.1);
  }

  /* Ventana de chat */
  #chat-window {
    display: none;
    flex-direction: column;
    background: #f7f7f7;
    border-radius: 15px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    height: 450px;
    overflow: hidden;
    margin-top: 10px;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  /* Mensajes */
  #chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .message.user {
    justify-content: flex-end;
  }

  .message .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }

  .message .text {
    max-width: 70%;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
  }

  .message.user .text {
    background-color: #007bff;
    color: white;
    border-bottom-right-radius: 0;
  }

  .message.bot .text {
    background-color: #e0e0e0;
    color: #333;
    border-bottom-left-radius: 0;
  }

  /* Input */
  #chat-input-container {
    display: flex;
    border-top: 1px solid #ccc;
    padding: 10px;
    background: #fff;
  }

  #chat-input {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 20px;
    padding: 8px 15px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }

  #chat-input:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0,123,255,0.5);
  }

  #chat-send {
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    margin-left: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: transform 0.2s;
  }
  #chat-send:hover {
    transform: scale(1.1);
  }
</style>

<div id="chat-container">
  <button id="chat-button">💬</button>
  <div id="chat-window">
    <div id="chat-messages"></div>
    <div id="chat-input-container">
      <input type="text" id="chat-input" placeholder="Type your message...">
      <button id="chat-send">➤</button>
    </div>
  </div>
</div>

<script>
  window.currentLang = 'en';

  const chatButton = document.getElementById('chat-button');
  const chatWindow = document.getElementById('chat-window');
  const chatSend = document.getElementById('chat-send');
  const chatInput = document.getElementById('chat-input');
  const chatMessages = document.getElementById('chat-messages');

  chatButton.addEventListener('click', () => {
    chatWindow.style.display = chatWindow.style.display === 'flex' ? 'none' : 'flex';
  });

  const chatData = {
    en: {
      intro: "Hi! I'm Mikel's virtual assistant. Ask me anything about his work, skills, or projects.",
      fallback: ["Sorry, I didn't understand that. Could you rephrase?", "I'm not sure about that. Can you ask differently?", "Hmm, I don't get it. Try another question!"],
      intents: {
        greeting: ["Hello! How can I help you today?", "Hi there! What would you like to know?", "Hey! I'm here to answer your questions."],
        name: ["I'm Mikel Baliño Zuazo's virtual assistant.", "You can call me Mikel's assistant.", "I assist with questions about Mikel."],
        skills: ["Mikel mainly uses Rhino, Grasshopper, AutoCAD, and BIM tools.", "He is proficient in Rhino, Grasshopper, AutoCAD, and BIM.", "Mikel works with Rhino, Grasshopper, AutoCAD, and BIM tools."],
        projects: ["You can explore Mikel's projects in the CAD, 3D, Renders, and Animations sections.", "Check out Mikel's portfolio: CAD, 3D, Renders, and Animations.", "Mikel's work is available in CAD, 3D, Renders, and Animations sections."],
        contact: ["You can reach Mikel via email or LinkedIn.", "Contact Mikel through email or LinkedIn.", "Feel free to email Mikel or find him on LinkedIn."]
      }
    },
    // ... puedes añadir es y eu como en el anterior ejemplo
  };

  function detectIntent(message) {
    message = message.toLowerCase();
    if (/(hello|hi|hey|hola|kaixo)/i.test(message)) return 'greeting';
    if (/(your name|who are you|tu nombre|cómo te llamas|zure izena|nor zara)/i.test(message)) return 'name';
    if (/(skills|tools|software|programs|habilidades|herramientas|trebetasun)/i.test(message)) return 'skills';
    if (/(projects|work|portfolio|proyectos|trabajo|lana)/i.test(message)) return 'projects';
    if (/(contact|email|linkedin|contacto|kontaktua)/i.test(message)) return 'contact';
    return null;
  }

  function getResponse(message, lang) {
    const intent = detectIntent(message);
    const data = chatData[lang];
    if (intent) {
      const responses = data.intents[intent];
      return responses[Math.floor(Math.random() * responses.length)];
    } else {
      const fallback = data.fallback;
      return fallback[Math.floor(Math.random() * fallback.length)];
    }
  }

  function addMessage(text, sender) {
    const msg = document.createElement('div');
    msg.classList.add('message', sender);
    const avatar = document.createElement('div');
    avatar.classList.add('avatar');
    avatar.style.backgroundImage = sender === 'user' ? "url('https://i.imgur.com/8Km9tLL.png')" : "url('https://i.imgur.com/7k12EPD.png')";
    avatar.style.backgroundSize = "cover";

    const messageText = document.createElement('div');
    messageText.classList.add('text');
    messageText.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(messageText);
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendMessage() {
    const msg = chatInput.value.trim();
    if (!msg) return;
    addMessage(msg, 'user');
    const botReply = getResponse(msg, window.currentLang);
    setTimeout(() => addMessage(botReply, 'bot'), 400);
    chatInput.value = '';
  }

  chatSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });

  window.addEventListener('DOMContentLoaded', () => {
    addMessage(chatData[window.currentLang].intro, 'bot');
  });
</script>
